name: Glim
options:
  bundleIdPrefix: com.robinvivant
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  HueKit:
    path: Packages/HueKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Glim:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - package: HueKit
      - target: GlimWidgets
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Glim
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        NSLocalNetworkUsageDescription: Glim talks to your Hue bridge on your home network.
        NSBonjourServices: [_hue._tcp]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: App/Glim.entitlements
      properties:
        com.apple.security.application-groups: [group.com.robinvivant.glim]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robinvivant.glim
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  GlimWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets, Shared]
    dependencies:
      - package: HueKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Glim
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/GlimWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.robinvivant.glim]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robinvivant.glim.widgets
  GlimUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Glim
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robinvivant.glim.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Glim:
    build:
      targets:
        Glim: all
        GlimUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [GlimUITests]
